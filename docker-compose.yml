services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-runtime:latest
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: 8g
    pids_limit: 4096
    cpus: 4.0
    working_dir: /workspace
    volumes:
      - ${PWD}:/workspace
      - agent-claude:/home/node/.claude
      - agent-codex:/home/node/.codex
      - agent-gh:/home/node/.config/gh
      - agent-history:/commandhistory
      - agent-npm:/home/node/.npm
      - agent-composer:/home/node/.composer
      - agent-pip:/home/node/.cache/pip
      - agent-playwright:/home/node/.cache/ms-playwright
      - agent-huggingface:/home/node/.cache/huggingface
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - HF_TOKEN
      - HUGGINGFACE_HUB_TOKEN
      - HUGGING_FACE_HUB_TOKEN
      - OPENAI_ALLOWED_DOMAINS
      - AGENT_ALLOWED_DOMAINS
      - TZ=Europe/Berlin
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CODEX_HOME=/home/node/.codex
      - AGENT_AUTO_LARAVEL_BOOST=${AGENT_AUTO_LARAVEL_BOOST:-1}
    networks:
      - agent-net
    command: sleep infinity

  postgres:
    image: postgres:16-alpine
    profiles: ["laravel"]
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel
      POSTGRES_DB: laravel
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    profiles: ["laravel"]
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  agent-claude:
  agent-codex:
  agent-gh:
  agent-history:
  agent-npm:
  agent-composer:
  agent-pip:
  agent-playwright:
  agent-huggingface:
  agent-postgres:
